name: windows

# Windows 판(windows/) 빌드. PR 마다 타입 검사·테스트·설치 파일까지 만들어 아티팩트로 올린다.
# main 에 windows/package.json 의 version 이 바뀌어 들어오면 windows-v<버전> 릴리스를 만들고 설치 파일을 붙인다.
# 본문은 windows/CHANGELOG.md 의 해당 버전 섹션. 앱의 업데이트 확인은 이 릴리스를 본다.
on:
  pull_request:
    paths: [windows/**, .github/workflows/windows.yml]
  push:
    branches: [main]
    paths: [windows/**, .github/workflows/windows.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ATM-windows-setup
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/windows-v$V" >/dev/null; then
            echo "windows-v$V already tagged, skip"; exit 0
          fi
          NOTES="$(awk -v v="$V" '/^## / { if (f) exit; split($0, a, " "); if (a[2] == v) { f = 1; next } } f { print }' CHANGELOG.md | sed -e '/./,$!d')"
          [ -n "$NOTES" ] || NOTES="업데이트 노트 없음"
          gh release create "windows-v$V" --target "$GITHUB_SHA" --title "Windows v$V" --notes "$NOTES" src-tauri/target/release/bundle/nsis/*.exe
