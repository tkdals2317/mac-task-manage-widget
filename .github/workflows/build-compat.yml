name: build-compat

# 팀원 Mac 에 깔린 낮은 툴체인에서도 빌드·테스트되는지 PR 마다 확인한다.
# 개발 Mac 은 최신 Swift / SDK 라서 새 API(onGeometryChange 등)나 최신 컴파일러에서만 통과하는 코드를 로컬에서 못 잡는다.
# GitHub 가 2026-11-02 macos-14 러너를 종료해 Xcode 15.4(Swift 5.10, macOS 14 SDK)는 호스팅 러너에서 더 이상 쓸 수 없다.
# 남은 이미지 중 가장 낮은 macos-15 + Xcode 16.0(Swift 6.0, macOS 15 SDK)을 쓴다. Swift 5.10 호환은 이 job 으로 확인되지 않는다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift510:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16.0 (Swift 6.0, macOS 15 SDK)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - run: swift --version
      - run: swift build
      - run: swift test
